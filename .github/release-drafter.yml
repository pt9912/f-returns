name-template: "v$NEXT_PATCH_VERSION 🌱"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Fixes"
    labels: ["bug"]
  - title: "🧪 Tests"
    labels: ["test"]
  - title: "🧰 Maintenance"
    labels: ["chore", "ci"]
change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS
exclude-labels:
  - "skip-changelog"
