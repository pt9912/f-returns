name: Release (GHCR)

on:
  push:
    tags:
      - "v*.*.*"          # z.B. v1.2.3
  release:
    types: [published]    # falls du GitHub-Releases nutzt

permissions:
  contents: read
  packages: write         # nötig für GHCR push

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: f-returns     # falls du repo-name willst: ${{ github.event.repository.name }}

jobs:
  docker:
    name: Build & Push Docker (GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from ref
        id: ver
        shell: bash
        run: |
          REF="${GITHUB_REF#refs/tags/}"        # e.g. v1.2.3-rc1
          echo "raw=${REF}" >> $GITHUB_OUTPUT

          BASE="${REF#v}"                       # 1.2.3-rc1
          CORE="${BASE%%-*}"                    # 1.2.3
          MAJOR="${CORE%%.*}"                   # 1
          MINOR="${CORE%.*}"                    # 1.2
          echo "core=${CORE}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT

          if [[ "${BASE}" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.raw }}      # v1.2.3
            type=raw,value=${{ steps.ver.outputs.core }}     # 1.2.3
            type=raw,value=${{ steps.ver.outputs.minor }}    # 1.2
            type=raw,value=${{ steps.ver.outputs.major }}    # 1
            ${{ steps.ver.outputs.prerelease == 'false' && 'type=raw,value=latest' || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.core }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
